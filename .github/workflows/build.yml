name: TeddyBench Windows

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Teddy.sln

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      with:
        msbuild-architecture: x64

    - name: Nuget restore
      run: nuget restore $env:Solution_Name

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -property:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeddyBench-${{ matrix.configuration }}
        path: TeddyBench/bin/${{ matrix.configuration }}/net8.0-windows/win-x64/TeddyBench.exe
      env:
        Configuration: ${{ matrix.configuration }}
