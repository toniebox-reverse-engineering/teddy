name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "master" ]

jobs:

  windows:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Teddy.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1
      with:
        msbuild-architecture: x64

    - name: Nuget restore
      run: nuget restore $env:Solution_Name

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -property:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeddyBench-${{ matrix.configuration }}
        path: TeddyBench/bin/${{ matrix.configuration }}/net48/win10-x64/TeddyBench.exe
      env:
        Configuration: ${{ matrix.configuration }}

  linux:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Teddy.Linux.slnf leaves out TeddyBench (WinForms, Windows only until it is ported)
    - name: Build
      run: dotnet build Teddy.Linux.slnf -c Release

    - name: Test
      run: dotnet test Teddy.Linux.slnf -c Release --no-build

    - name: Publish Teddy CLI (self-contained, single file)
      run: >
        dotnet publish Teddy/Teddy.csproj -c Release -r linux-x64 --self-contained
        -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/linux-x64

    - name: Smoke test published binary
      run: publish/linux-x64/Teddy --help

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Teddy-linux-x64
        path: publish/linux-x64/Teddy
