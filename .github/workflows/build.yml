name: Build

on:
  push:
    # "*" does not match names with a slash, so the integration branch is listed explicitly
    branches: [ "*", "linux-port/integration" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "linux-port/integration" ]
  # "Run workflow" button in the Actions tab
  workflow_dispatch:

jobs:

  windows:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Teddy.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1
      with:
        msbuild-architecture: x64

    - name: Nuget restore
      run: nuget restore $env:Solution_Name

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -property:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeddyBench-${{ matrix.configuration }}
        path: TeddyBench/bin/${{ matrix.configuration }}/net48/win10-x64/TeddyBench.exe
      env:
        Configuration: ${{ matrix.configuration }}

  linux:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Teddy.Linux.slnf leaves out TeddyBench (WinForms, Windows only until it is ported)
    - name: Build
      run: dotnet build Teddy.Linux.slnf -c Release

    - name: Test
      run: dotnet test Teddy.Linux.slnf -c Release --no-build

    # build.sh only repackages into the Flatpak (no flatpak-builder), it needs flatpak and the runtime
    - name: Install flatpak and the freedesktop runtime
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q flatpak
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08

    # AppImage (GUI + "cli" mode), Flatpak bundle and tarball with a per-user installer, see packaging/linux
    - name: Build Linux packages
      run: packaging/linux/build.sh
      env:
        # the GUI checks this repository's releases for updates
        TEDDY_UPDATE_REPOSITORY: ${{ github.repository }}

    - name: Smoke test packages
      run: |
        artifacts/work/lib/Teddy --help
        APPIMAGE_EXTRACT_AND_RUN=1 artifacts/TeddyBench-x86_64.AppImage cli --help
        tar -tzf artifacts/TeddyBench-linux-x64.tar.gz teddybench-linux-x64/install.sh
        # installing checks the bundle and its runtime reference; running needs user namespaces (not on runners)
        flatpak install --user -y --noninteractive artifacts/TeddyBench-x86_64.flatpak
        flatpak info --user io.github.toniebox_reverse_engineering.TeddyBench

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeddyBench-linux-x64
        path: |
          artifacts/TeddyBench-x86_64.AppImage
          artifacts/TeddyBench-x86_64.flatpak
          artifacts/TeddyBench-linux-x64.tar.gz

  release:
    # attach the Linux packages to the GitHub release of a pushed v* tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout (release notes)
      uses: actions/checkout@v4

    - name: Download Linux packages
      uses: actions/download-artifact@v4
      with:
        name: TeddyBench-linux-x64
        path: artifacts

    - name: Create or update release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # notes from docs/release-notes/<tag>.md if present, else generated from the commits;
        # tags like v2.1.0-rc.1 become pre-releases
        notes="docs/release-notes/$GITHUB_REF_NAME.md"
        if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
        case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; *) pre=() ;; esac
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
        else
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "TeddyBench $GITHUB_REF_NAME" "${notes_args[@]}" "${pre[@]}"
        fi
